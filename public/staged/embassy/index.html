<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Embassy Crisis Registration Portal</title>
<style>body{font-family:Georgia,serif;background:#e9e6dd;margin:0}
header{background:#1a2a4a;color:#fff;padding:18px 28px}main{max-width:560px;margin:40px auto;background:#fff;padding:28px;border:1px solid #bbb}
label{display:block;margin:14px 0 4px;font-weight:bold}input,select{width:100%;padding:9px;border:1px solid #999;font-size:15px}
button{margin-top:20px;padding:12px 26px;background:#1a2a4a;color:#fff;border:0;font-size:16px}
.ref{font-size:22px;color:#1a2a4a;font-weight:bold}.hidden{display:none}</style>
</head>
<body>
  <!-- Staged, deliberately clunky, NO API: the Rung-2 Computer Use target.
       Their own track example used a staged environment — this is sanctioned. -->
  <header><h1>Consular Crisis Assistance — Citizen Registration</h1></header>
  <main>
    <form id="f">
      <label>Full name</label><input id="name" required>
      <label>Nationality</label><select id="nat"><option>—</option><option>Spain</option><option>Germany</option><option>France</option><option>Other (EU)</option></select>
      <label>Current location (city / district)</label><input id="loc" required>
      <label>Travelling companions</label><input id="comp" placeholder="e.g. 1 child, age 6">
      <label>Contact number</label><input id="tel" type="tel">
      <button type="submit">Register for assistance</button>
    </form>
    <div id="done" class="hidden">
      <h2>Registration received</h2>
      <p>Your crisis assistance reference number:</p>
      <p class="ref" id="refno"></p>
      <p>Keep this number. Consular staff will contact you.</p>
    </div>
  </main>
  <script>
    document.getElementById('f').onsubmit = (e) => {
      e.preventDefault();
      document.getElementById('f').classList.add('hidden');
      document.getElementById('done').classList.remove('hidden');
      document.getElementById('refno').textContent =
        'CR-2026-' + String(Math.floor(100000 + Math.random() * 900000));
    };
  </script>
</body>
</html>
