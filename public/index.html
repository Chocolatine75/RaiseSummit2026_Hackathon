<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>AEGIS</title>
  <link rel="manifest" href="/manifest.json" />
  <!-- Leaflet (cached by the service worker → works in airplane mode) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="/styles.css" />
  <meta name="theme-color" content="#0a0e12" />
</head>
<body>
  <!-- Engine strip: WHICH BRAIN IS DRIVING, visible at all times (the judges' proof) -->
  <header id="strip">
    <div id="mode" class="mode online">
      <span class="dot"></span>
      <span id="modeLabel">ONLINE</span>
      <span id="engine">Gemini 3.5 Flash · cloud</span>
    </div>
    <div class="ids">
      <span>itx <b id="chainId">—</b></span>
      <span>env <b id="envId">—</b></span>
      <span id="qa" class="qa">QA —</span>
    </div>
  </header>

  <!-- Main viewport: map or camera, toggled by the bottom bar -->
  <main>
    <section id="mapView" class="view active">
      <div id="map"></div>
      <div id="mapBadge" hidden>⬇ caching map pack… <b id="tileCount"></b></div>
      <div id="mapCredit">© OpenStreetMap · shelters: Google Maps grounding</div>
    </section>

    <section id="camView" class="view">
      <video id="camStream" autoplay playsinline muted></video>
      <div id="camHint">Point at signage, then tap SCAN</div>
      <button id="scanBtn">SCAN SIGN</button>
    </section>
  </main>

  <!-- The evacuation-sign card: ONE instruction, always on screen -->
  <section id="card">
    <div id="runner">🏃</div>
    <div id="cardBody">
      <p id="instruction">Stay aware. I'm listening to the station around you.</p>
      <p id="freshness"></p>
      <p id="question"></p>
    </div>
    <button id="confirmBtn" hidden>CONFIRM ✓</button>
  </section>

  <!-- Activity drawer -->
  <details id="drawer">
    <summary>Activity</summary>
    <div id="feed"></div>
  </details>

  <!-- Ask row + view switch -->
  <footer>
    <input id="askInput" placeholder="Ask AEGIS…" autocomplete="off" />
    <button id="askBtn">ASK</button>
    <button id="voiceBtn" type="button">VOICE</button>
    <nav>
      <button id="tabMap" class="tab active">🗺 MAP</button>
      <button id="tabCam" class="tab">📷 CAMERA</button>
    </nav>
    <details id="demoControls">
      <summary>demo</summary>
      <button data-demo="quake">🌏 Quake</button>
      <button data-demo="pack">⬇ Map pack</button>
      <button data-demo="reset">↺ Reset</button>
      <button data-demo="offline">✈ Simulate offline</button>
    </details>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js" crossorigin="anonymous"></script>
  <!-- MediaPipe GenAI (offline Gemma). SW caches bundle + wasm + model. -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai/genai_bundle.cjs" crossorigin="anonymous"></script>
  <script src="/app.js"></script>
</body>
</html>
